<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ConForce Marketplace</title>
    <meta name="description" content="ConForce Marketplace - Plataforma global para todo tipo de negocios, tiendas y servicios con geolocalización y pedidos en tiempo real." />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="ConForce" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ConForce Marketplace" />

    <!-- Open Graph -->
    <meta property="og:title" content="ConForce Marketplace" />
    <meta property="og:description" content="ConForce Marketplace - Plataforma global para todo tipo de negocios, tiendas y servicios con geolocalización y pedidos en tiempo real." />
    <meta property="og:type" content="website" />
    
    <link rel="icon" type="image/png" href="https://cjoszqkgqtgfvzqxcsvi.supabase.co/storage/v1/object/public/logos/conforcelogo.png" />
    <link rel="apple-touch-icon" href="https://cjoszqkgqtgfvzqxcsvi.supabase.co/storage/v1/object/public/logos/conforcelogo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Filter harmless Vite dev server HMR websocket notifications in cloud sandboxes
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || event.reason?.message?.includes('WebSocket'))) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-[#D4021D] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
